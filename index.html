<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CricketArena - Online Cricket Gaming</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #08111f;
    color: white;
}

/* NAVBAR */

.navbar {
    height: 75px;
    padding: 0 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0c192b;
    border-bottom: 1px solid #1b2d45;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.logo span {
    color: #27e36a;
}

.nav-links {
    display: flex;
    gap: 28px;
}

.nav-links a {
    color: #cbd5e1;
    text-decoration: none;
    font-size: 14px;
}

.nav-links a:hover {
    color: #27e36a;
}

/* HERO */

.hero {
    min-height: 540px;
    display: flex;
    align-items: center;
    padding: 70px 7%;
    background:
        linear-gradient(90deg, #08111f 15%, rgba(8,17,31,.7), rgba(8,17,31,.3)),
        url("https://images.unsplash.com/photo-1531415074968-036ba1b575da?auto=format&fit=crop&w=1800&q=85")
        center/cover;
}

.hero-content {
    max-width: 650px;
}

.badge {
    display: inline-block;
    background: rgba(39,227,106,.12);
    color: #27e36a;
    border: 1px solid rgba(39,227,106,.4);
    padding: 8px 14px;
    border-radius: 30px;
    font-size: 13px;
    margin-bottom: 20px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 76px);
    line-height: 1;
    margin-bottom: 25px;
}

.hero h1 span {
    color: #27e36a;
}

.hero p {
    color: #c2ccda;
    line-height: 1.7;
    font-size: 17px;
    margin-bottom: 30px;
}

.hero-buttons {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
}

.primary-btn,
.secondary-btn {
    padding: 14px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
}

.primary-btn {
    background: #27e36a;
    color: #07111d;
}

.secondary-btn {
    background: transparent;
    color: white;
    border: 1px solid #52647a;
}

.primary-btn:hover {
    background: #19c957;
}

.secondary-btn:hover {
    border-color: #27e36a;
    color: #27e36a;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: #0c192b;
    border-top: 1px solid #1c2d43;
    border-bottom: 1px solid #1c2d43;
}

.stat {
    text-align: center;
    padding: 25px 10px;
    border-right: 1px solid #1c2d43;
}

.stat strong {
    display: block;
    font-size: 25px;
    color: #27e36a;
    margin-bottom: 5px;
}

.stat span {
    color: #94a3b8;
    font-size: 13px;
}

/* MAIN */

.container {
    width: 86%;
    max-width: 1250px;
    margin: auto;
}

.section {
    padding: 75px 0;
}

.section-heading {
    margin-bottom: 35px;
}

.section-heading small {
    color: #27e36a;
    font-weight: bold;
}

.section-heading h2 {
    font-size: 36px;
    margin-top: 8px;
}

.section-heading p {
    color: #91a0b4;
    margin-top: 10px;
}

/* GAME CARDS */

.game-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.game-card {
    background: #0d1a2c;
    border: 1px solid #1c3048;
    border-radius: 15px;
    overflow: hidden;
    transition: .25s;
}

.game-card:hover {
    transform: translateY(-6px);
    border-color: #27e36a;
}

.game-image {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 75px;
}

.batting {
    background: linear-gradient(135deg, #173e5c, #12673d);
}

.fantasy {
    background: linear-gradient(135deg, #35255e, #1b3b70);
}

.quiz {
    background: linear-gradient(135deg, #5a321b, #773b2b);
}

.game-info {
    padding: 23px;
}

.game-info h3 {
    font-size: 22px;
    margin-bottom: 10px;
}

.game-info p {
    color: #91a0b4;
    line-height: 1.6;
    font-size: 14px;
    margin-bottom: 20px;
}

.play-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 7px;
    background: #27e36a;
    color: #07111d;
    cursor: pointer;
    font-weight: bold;
}

.play-btn:hover {
    background: #19c957;
}

/* MATCHES */

.matches {
    background: #0c192b;
}

.match-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.match {
    padding: 23px;
    background: #101f33;
    border: 1px solid #1e334d;
    border-radius: 12px;
}

.live {
    color: #ff5252;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 15px;
}

.teams {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
}

.team {
    display: flex;
    align-items: center;
    gap: 10px;
}

.team-icon {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #182b42;
}

.score {
    color: #27e36a;
}

/* NEWS */

.news-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.news-card {
    padding: 24px;
    background: #0d1a2c;
    border-radius: 12px;
    border: 1px solid #1c3048;
}

.news-card span {
    color: #27e36a;
    font-size: 12px;
}

.news-card h3 {
    margin: 12px 0;
    line-height: 1.4;
}

.news-card p {
    color: #91a0b4;
    font-size: 14px;
    line-height: 1.6;
}

/* FOOTER */

footer {
    padding: 35px 7%;
    background: #050c15;
    border-top: 1px solid #17283c;
    text-align: center;
    color: #7f8da1;
}

footer strong {
    color: #27e36a;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    background: #0d1a2c;
    border: 1px solid #29415e;
    border-radius: 16px;
    padding: 30px;
    position: relative;
}

.close {
    position: absolute;
    right: 20px;
    top: 15px;
    border: none;
    background: none;
    color: white;
    font-size: 30px;
    cursor: pointer;
}

.modal-box h2 {
    margin-bottom: 8px;
}

.modal-description {
    color: #8fa0b5;
    margin-bottom: 20px;
}

/* BATTING GAME */

.score-board {
    background: #07111d;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    margin: 20px 0;
}

.score-number {
    color: #27e36a;
    font-size: 55px;
    font-weight: bold;
}

.balls {
    color: #a7b3c3;
}

.hit-button {
    width: 100%;
    padding: 17px;
    border: none;
    background: #27e36a;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.hit-button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.game-message {
    text-align: center;
    margin-top: 18px;
    color: #cbd5e1;
}

/* FANTASY */

.players {
    display: grid;
    gap: 10px;
    margin: 20px 0;
}

.player {
    padding: 14px;
    background: #101f33;
    border: 1px solid #263b54;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
}

.player input {
    width: 18px;
    height: 18px;
}

.create-team {
    width: 100%;
    padding: 14px;
    background: #27e36a;
    color: #07111d;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* QUIZ */

.quiz-question {
    font-size: 20px;
    font-weight: bold;
    line-height: 1.5;
    margin: 20px 0;
}

.quiz-options {
    display: grid;
    gap: 10px;
}

.quiz-option {
    background: #101f33;
    color: white;
    border: 1px solid #2a4059;
    padding: 14px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
}
